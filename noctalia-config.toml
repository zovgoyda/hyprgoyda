[plugin_settings."noctalia/mpvpaper"]
video_directory = "/home/goyda/"

[plugin_settings."tadomika_ari/w-engine"]
sync_colors = false

[plugins]
enabled = [ "icefish/phone-connect", "avivbintangaringga/nextboot-selector", "tadomika_ari/w-engine" ]

[shell]
app_icon_colorize = true
avatar_path = "/home/goyda/SSD/Изображения/the-russian-revolutionary-vladimir-lenin-and-his-cat-1921-v0-0pou9k6bjlqz.jpg"
clipboard_auto_paste = "off"
clipboard_history_max_entries = 600
font_family = "Inter Variable"
niri_overview_type_to_launch_enabled = true
password_style = "random"
polkit_agent = true
screen_time_enabled = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"

    [shell.screen_corners]
    enabled = true

    [shell.screenshot]
    directory = "/home/goyda/SSD/Screenshots"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "4"
    variant = "default"

[templates.sddm]
input_path = "/usr/share/sddm/themes/noctalia/theme.template.conf"
output_path = "/usr/share/sddm/themes/noctalia/theme.conf"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [
        "pywalfox",
        "pywalfox-beta4",
        "discord",
        "libreoffice",
        "neovim",
        "vscode",
        "prismlauncher",
        "steam",
        "fuzzel",
        "fastfetch",
        "hyprtoolkit",
        "yazi"
    ]

[wallpaper]
directory = "/home/goyda/SSD/wallpapers"
transition = []

    [wallpaper.default]
    path = "/home/goyda/SSD/wallpapers/1632688330_upf5m4l0aoo51.jpg"

    [wallpaper.last]
    path = "/home/goyda/SSD/wallpapers/i3333.webp"

    [wallpaper.monitors.DP-1]
    path = "/home/goyda/SSD/wallpapers/i3333.webp"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/goyda/SSD/wallpapers/i.webp"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/goyda/SSD/wallpapers/1632688330_upf5m4l0aoo51.jpg"

[widget.bar]
